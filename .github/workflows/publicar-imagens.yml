name: Publicar imagens

# As imagens vão para o ghcr.io porque a VPS de produção não tem código-fonte:
# ela só faz `pull`. Sem isso, corrigir o backup exigiria editar shell script
# direto no servidor, sem revisão e sem histórico.

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - imagem: postgres-backup
            dockerfile: Dockerfile
          - imagem: postgres-restore
            dockerfile: Dockerfile-restore
    steps:
      - uses: actions/checkout@v4

      # Erro de sintaxe em shell só aparece na execução, e a execução de um
      # script de backup é uma vez por hora, em produção. Conferir aqui é o
      # único ponto barato.
      - name: Validar sintaxe dos scripts
        run: bash -n backup.sh && bash -n restore.sh

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.imagem }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.imagem }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
